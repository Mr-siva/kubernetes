apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webapp-resources         # which deployment to scale
  minReplicas: 2                   # never go below 2
  maxReplicas: 8                   # never go above 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50     # if avg CPU > 50% of request → scale UP