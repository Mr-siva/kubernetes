apiVersion: v1
kind: Pod
metadata:
  name: cfg-pod
  namespace: refresh-03
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    env:
    - name: APP_MODE
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: APP_MODE
    volumeMounts:
    - name: cfg
      mountPath: /etc/config
    - name: sec
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: cfg
    configMap:
      name: app-config
  - name: sec
    secret:
      secretName: app-secret
