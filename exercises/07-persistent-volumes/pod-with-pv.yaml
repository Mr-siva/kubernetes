apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  labels:
    app: storage-test
spec:
  containers:
  - name: writer
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Written at $(date)" >> /data/hello.txt
        echo "File contents:"
        cat /data/hello.txt
        sleep 3600
    volumeMounts:
    - name: my-storage
      mountPath: /data              # container sees PV at /data/
  volumes:
  - name: my-storage
    persistentVolumeClaim:
      claimName: my-pvc             # links to the PVC above