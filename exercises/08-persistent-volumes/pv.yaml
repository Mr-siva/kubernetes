apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-pv
spec:
  capacity:
    storage: 1Gi                    # 1 GB disk
  accessModes:
    - ReadWriteOnce                 # one pod can read/write at a time
  persistentVolumeReclaimPolicy: Retain    # keep data even after PVC is deleted
  hostPath:
    path: /tmp/k8s-storage          # local path on node (KinD only — prod uses EBS/EFS)