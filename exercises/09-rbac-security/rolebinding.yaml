apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-user-pod-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: dev-user               # WHO gets the permission
  namespace: default
roleRef:
  kind: Role
  name: pod-reader             # WHICH role to assign
  apiGroup: rbac.authorization.k8s.io